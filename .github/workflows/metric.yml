# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  push: { branches: ["master"] }
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Metrics
        uses: actions/checkout@v4
        with:
          repository: lowlighter/metrics
          ref: 65836723097537a54cd8eb90f61839426b4266b6 # Metrics 3.34.0
          path: .metrics
          persist-credentials: false
      - name: Patch Metrics using its official runtime image
        run: python3 .github/scripts/patch_metrics.py .metrics
      - uses: ./.metrics
        with:
          debug: yes
          use_prebuilt_image: no
          repositories: 200
          repositories_batch: 25
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: purpleKarrot
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Zurich
          output_action: gist
          committer_gist: a19836bd3be1f84ca0ad9e7421f4170f

          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_lines: yes
